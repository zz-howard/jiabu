[workspace]
resolver = "3"
members = ["crates/*", "bins/server", "bins/admin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
jiabu-domain = { path = "crates/domain" }
jiabu-db = { path = "crates/db" }
jiabu-storage = { path = "crates/storage" }
jiabu-ai = { path = "crates/ai" }
jiabu-tools = { path = "crates/tools" }
jiabu-chat = { path = "crates/chat" }
jiabu-agent = { path = "crates/agent" }
jiabu-api = { path = "crates/api" }
jiabu-db-admin = { path = "crates/db-admin" }
jiabu-admin = { path = "crates/admin" }
jiabu-admin-api = { path = "crates/admin-api" }

axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["timeout", "compression-gzip", "catch-panic", "sensitive-headers"] }
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json", "with-rust_decimal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
uuid = { version = "1.29", features = ["v7", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.6"
sha2 = "0.11"
crc32fast = "=1.5.3" # Already present in Cargo.lock; TODO(luna): refresh direct dependency edges.
rand = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
config = "0.15"
secrecy = "0.10"
# MIT / Apache-2.0; no cloud backend or non-JPEG codec features.
object_store = { version = "0.14.2", default-features = false, features = ["fs"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
infer = { version = "0.22.0", default-features = false }
# BSD-2-Clause (crate is imported as `exif`).
kamadak-exif = { version = "0.6.1" }
# Already present transitively in Cargo.lock; preserve those versions.
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# MIT; reviewed ChatWeave CW1 revision. Resolve the lockfile on the build host.
chatweave-protocol = { git = "https://github.com/zz-howard/chatweave", rev = "acd253a0aec8aad5c138544dcc0c06fe77754e0f" }
chatweave-server = { git = "https://github.com/zz-howard/chatweave", rev = "acd253a0aec8aad5c138544dcc0c06fe77754e0f", features = ["axum"] }
# Only chat, agent, and api may depend on ChatWeave.

[profile.release]
lto = "thin"

[workspace.dependencies.schemars]
version = "1.2"
features = ["chrono04", "uuid1"]
[workspace.dependencies.validator]
version = "0.21"
features = ["derive"]
# Runtime validator for the generated schemas. jsonschema uses MIT licensing;
# Disable default HTTP/file resolution to keep local schemas self-contained.
[workspace.dependencies.jsonschema]
version = "0.60"
default-features = false

# MIT / Apache-2.0; reuse Cargo.lock's existing package.
[workspace.dependencies.unicode-normalization]
version = "0.1.26"

# S7: MIT / Apache-2.0 unless noted; lockfile generated on the build host.
[workspace.dependencies.async-openai]
version = "0.42"
default-features = false
features = ["responses"] # TODO(luna): verify 0.42 feature spelling on build host.
[workspace.dependencies.oauth2]
version = "5"
default-features = false
[workspace.dependencies.reqwest]
version = "0.13" # TODO(luna): align with async-openai 0.42's resolved reqwest.
default-features = false
features = ["json", "form", "stream", "rustls"]
[workspace.dependencies.async-trait]
version = "0.1"
[workspace.dependencies.arc-swap]
version = "1"
[workspace.dependencies.chacha20poly1305]
version = "0.11.0"
[workspace.dependencies.zeroize]
version = "1.9.1"
[workspace.dependencies.base64]
version = "0.22"
[workspace.dependencies.wiremock]
version = "0.6"
# Apache-2.0
[workspace.dependencies.insta]
version = "1.49"
features = ["json"]
