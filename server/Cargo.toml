[workspace]
resolver = "3"
members = ["crates/*", "bins/server", "bins/admin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
jiabu-domain = { path = "crates/domain" }
jiabu-db = { path = "crates/db" }
jiabu-storage = { path = "crates/storage" }
jiabu-ai = { path = "crates/ai" }
jiabu-tools = { path = "crates/tools" }
jiabu-chat = { path = "crates/chat" }
jiabu-agent = { path = "crates/agent" }
jiabu-api = { path = "crates/api" }
jiabu-db-admin = { path = "crates/db-admin" }
jiabu-admin = { path = "crates/admin" }
jiabu-admin-api = { path = "crates/admin-api" }

axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["timeout", "compression-gzip", "catch-panic", "sensitive-headers"] }
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json", "with-rust_decimal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
uuid = { version = "1.29", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.6"
sha2 = "0.11"
rand = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
config = "0.15"
secrecy = "0.10"
# ChatWeave has no Rust implementation yet. Add pinned protocol/server crates after CW1.
# Only chat, agent, and api may depend on ChatWeave.

[profile.release]
lto = "thin"
