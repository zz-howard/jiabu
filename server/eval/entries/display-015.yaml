schema_version: 2
id: "display-015"
locale: "zh-Hans"
category: "display"
today: "2026-10-21"
timezone: "Asia/Shanghai"
tier: "integration"
input: {text: "看看虚构银行卡余额；不支持账户卡时用指标。"}
client_capabilities:
  blocks: {markdown: 1, metric: 1}
setup:
  currency: "CNY"
  accounts:
    - {key: "bank", kind: "real", name: "虚构银行卡", opening_on: "2026-01-01"}
    - {key: "daily", kind: "purpose", name: "虚构日常", opening_on: "2026-01-01"}
  records:
    - key: "expense"
      record: {operation: "create", kind: "expense", amount_minor: 6800, currency: "CNY", occurred_on: "2026-10-01", account: "bank", purpose: "daily", preset_key: "dining"}
expect:
  behavior: "no_write"
  hard: false
  records: []
  display:
    hard: true
    calls:
      - {tool: "show_account_card", args: {account_id: "$account:bank"}}
    blocks:
      - {kind: "metric", labels: ["虚构银行卡"], values_minor: [-6800], account: null, demo: false}
    fallback_contains: []
    server_fallback_contains: ["虚构银行卡", "68.00"]
    prose: {max_sentences: 2, forbid_mermaid: true, forbid_ascii_chart: true, max_table_rows: 5}
