---
schema_version: 2
id: display-012
locale: en
category: display
today: '2026-10-21'
timezone: Asia/Singapore
input:
  text: Show October spending by purpose as metric cards.
setup:
  currency: CNY
  accounts:
  - key: bank
    kind: real
    name: Fictional Bank
    opening_on: '2026-01-01'
  - key: daily
    kind: purpose
    name: Fictional Daily
    opening_on: '2026-01-01'
  - key: saving
    kind: purpose
    name: Fictional Reserve
    opening_on: '2026-01-01'
  records:
  - key: daily-record
    record:
      operation: create
      kind: expense
      amount_minor: 6800
      currency: CNY
      occurred_on: '2026-10-01'
      account: bank
      purpose: daily
      preset_key: dining
  - key: saving-record
    record:
      operation: create
      kind: expense
      amount_minor: 3200
      currency: CNY
      occurred_on: '2026-10-02'
      account: bank
      purpose: saving
      preset_key: shopping
expect:
  behavior: no_write
  hard: false
  records: []
  display:
    hard: true
    alternatives:
    - id: exact
      calls:
      - tool: show_metrics
        args:
          source:
            query:
              measure: sum
              kinds:
              - expense
              period:
                from: '2026-10-01'
                through: '2026-10-31'
              group_by: purpose
              account_id:
              purpose_id:
              tag_id:
              member_id:
            from_call:
            demo:
      blocks:
      - kind: metric_group
        labels:
        - Fictional Daily
        - Fictional Reserve
        values_minor:
        - 6800
        - 3200
        account:
        demo: false
      fallback_contains: []
      facts:
      - kind: aggregate
        label: Fictional Daily
        value_minor: 6800
      - kind: aggregate
        label: Fictional Reserve
        value_minor: 3200
    prose:
      max_sentences: 2
      forbid_mermaid: true
      forbid_ascii_chart: true
      max_table_rows: 5
