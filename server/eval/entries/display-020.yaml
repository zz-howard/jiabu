schema_version: 2
id: "display-020"
locale: "zh-Hans"
category: "display"
today: "2026-10-21"
timezone: "Asia/Shanghai"
input: {text: "标签可能重叠，用柱状图比较本月餐饮和购物支出。"}
setup:
  currency: "CNY"
  accounts:
    - {key: "bank", kind: "real", name: "虚构银行卡", opening_on: "2026-01-01"}
    - {key: "daily", kind: "purpose", name: "虚构日常", opening_on: "2026-01-01"}
  records:
    - key: "dining-record"
      record: {operation: "create", kind: "expense", amount_minor: 6800, currency: "CNY", occurred_on: "2026-10-01", account: "bank", purpose: "daily", preset_keys: ["dining", "shopping"]}
    - key: "shopping-record"
      record: {operation: "create", kind: "expense", amount_minor: 3200, currency: "CNY", occurred_on: "2026-10-02", account: "bank", purpose: "daily", preset_key: "dining"}
expect:
  behavior: "no_write"
  hard: false
  records: []
  display:
    hard: true
    calls:
      - tool: "show_bar_chart"
        args: {source: {query: {measure: "sum", kinds: ["expense"], period: {from: "2026-10-01", through: "2026-10-31"}, group_by: "tag", account_id: null, purpose_id: null, tag_id: null, member_id: null}, from_call: null, demo: null}}
    blocks:
      - {kind: "category_series", labels: ["餐饮", "购物"], values_minor: [10000, 6800], account: null, demo: false}
    fallback_contains: []
    prose: {max_sentences: 2, forbid_mermaid: true, forbid_ascii_chart: true, max_table_rows: 5}
