[graph]
all-features = false

[advisories]
# RustSec security advisories are checked by default. No ignored advisories.
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    # webpki-roots (Mozilla CA bundle data), pulled in by sqlx/sea-orm rustls.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
