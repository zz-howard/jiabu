name: jiabu_design
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.13.7
  flutter: 3.47.8
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  yaml: ^3.1.3
flutter:
  assets:
    - assets/licenses/
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/jiabu_numerals.ttf
          weight: 600
    - family: JiabuHand
      fonts:
        - asset: assets/fonts/jiabu_hand.ttf
          weight: 500
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/jiabu_serif.otf
          weight: 700
