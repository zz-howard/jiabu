name: Issue 62 evaluation binary

'on':
  push:
    branches: [ci/issue62-display-binary]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Run focused mock regressions
        run: |
          cargo fmt --all -- --check
          cargo test -p ai-eval --lib judge::tests::bounded_diagnostics_use_only_closed_failure_classes -- --exact
          cargo test -p ai-eval --test negative_controls prose_only_mock_uses_typed_facts_and_wrong_value_is_rejected -- --exact
          cargo test -p ai-eval --test negative_controls component_mock_does_not_echo_typed_facts_as_prose -- --exact
      - name: Build live evaluator
        run: |
          cargo build --release -p ai-eval --features live --bin ai-eval
          strip target/release/ai-eval
      - uses: actions/upload-artifact@v4
        with:
          name: issue62-ai-eval
          path: server/target/release/ai-eval
          if-no-files-found: error
          retention-days: 1
