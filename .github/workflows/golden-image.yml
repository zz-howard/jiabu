name: Build fixed golden image
'on':
  workflow_dispatch:
    inputs:
      pub_hosted_url:
        description: Optional pub mirror URL
        required: false
        type: string
      flutter_storage_base_url:
        description: Optional Flutter storage mirror URL
        required: false
        type: string
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: client/tool/build-host/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zz-howard/jiabu-flutter-ci:3.47.8-1
          labels: org.opencontainers.image.source=https://github.com/zz-howard/jiabu
          build-args: |
            PUB_HOSTED_URL=${{ inputs.pub_hosted_url }}
            FLUTTER_STORAGE_BASE_URL=${{ inputs.flutter_storage_base_url }}
